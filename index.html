<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giulia & Lorenzo | Invito Matrimonio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sand-pearl': '#E6D5C3',
                        'sand-light': '#F7F3EE',
                        'ocean-blue': '#2B5B84',
                        'ocean-dark': '#1A365D',
                        'paper': '#FCFBF9'
                    },
                    fontFamily: {
                        'cursive': ['"Great Vibes"', 'cursive'], 
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body { overflow-x: hidden; scroll-behavior: smooth; background-color: #F7F3EE; }
        #unboxing-layer { transition: opacity 1.5s ease-in-out; will-change: opacity; }
        .hero-text-anim { opacity: 0; transform: translateY(40px); transition: opacity 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .hero-text-anim.loaded { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.6s; }
        .delay-2 { transition-delay: 1.2s; }
        .delay-3 { transition-delay: 1.8s; }
        .gradient-overlay { position: absolute; bottom: -2px; left: 0; width: 100%; height: 350px; background: linear-gradient(to bottom, rgba(247, 243, 238, 0) 0%, rgba(247, 243, 238, 1) 100%); z-index: 10; pointer-events: none; }
        .paper-card { background-color: #FCFBF9; box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.03), 0 5px 15px -5px rgba(0, 0, 0, 0.02); border: 1px solid rgba(230, 213, 195, 0.3); border-radius: 4px; }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .carousel-container { overflow: hidden; position: relative; width: 100%; }
        .carousel-track { display: flex; transition: transform 0.6s ease-in-out; width: 100%; }
        .carousel-slide { flex: 0 0 100%; min-width: 100%; height: 55vh; overflow: hidden; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
        .minimal-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #E6D5C3; padding: 10px 0; font-family: 'Montserrat', sans-serif; color: #4a4a4a; transition: border-color 0.3s ease; }
        .minimal-input:focus { outline: none; border-bottom-color: #2B5B84; }
        .collapsible-content { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.6s ease-in-out, opacity 0.6s ease-in-out, margin 0.6s ease-in-out; }
        .collapsible-content.open { max-height: 500px; opacity: 1; }
        .faq-icon { transition: transform 0.4s ease; }
        .faq-icon.open { transform: rotate(45deg); }
    </style>
</head>
<body class="font-sans text-gray-700 antialiased selection:bg-ocean-blue selection:text-white">

    <audio id="bg-music" loop preload="auto">
        <source src="https://res.cloudinary.com/di7plu3yz/video/upload/v1779182848/audio_eghhhr.mp4" type="audio/mp4">
    </audio>

    <button id="music-toggle" class="fixed top-6 right-6 z-[200] bg-white/30 backdrop-blur-md p-3 rounded-full hover:bg-white/50 transition-all text-white">
        <i data-lucide="music" id="music-icon" class="w-6 h-6"></i>
    </button>

    <div id="unboxing-layer" class="fixed inset-0 z-[100] cursor-pointer bg-sand-pearl">
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center z-20 transition-opacity duration-300">
            <img src="https://res.cloudinary.com/di7plu3yz/video/upload/so_0/v1779136621/video_busta_uff_gk7ejf.jpg" alt="Copertina Invito" class="absolute inset-0 w-full h-full object-cover pointer-events-none">
            <div class="relative z-30 flex flex-col items-center animate-pulse mt-[40vh]">
                <span class="text-white/90 text-xs md:text-sm tracking-[0.3em] uppercase font-bold drop-shadow-lg bg-black/20 px-4 py-2 rounded-full backdrop-blur-sm">Tocca per aprire</span>
            </div>
        </div>
        <video id="envelope-video" playsinline webkit-playsinline muted preload="auto" class="absolute inset-0 w-full h-full object-cover z-10 pointer-events-none">
            <source src="https://res.cloudinary.com/di7plu3yz/video/upload/v1779136621/video_busta_uff_gk7ejf.mp4" type="video/mp4">
        </video>
        <div id="luminous-flash" class="absolute inset-0 bg-white z-30 opacity-0 pointer-events-none transition-opacity duration-700 ease-in"></div>
    </div>

    <main id="main-content">
        <section class="relative w-full h-[100svh] flex items-center justify-center overflow-hidden">
            <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0">
                <source src="https://res.cloudinary.com/di7plu3yz/video/upload/v1779030472/bagnoasciuga_npzshx.mp4" type="video/mp4">
            </video>
            <div class="absolute inset-0 bg-black/30 z-0"></div>
            <div class="relative z-10 text-center text-white px-4 flex flex-col items-center w-full mt-[-8vh]">
                <p id="hero-announce" class="hero-text-anim font-sans font-light tracking-[0.3em] text-[10px] md:text-xs uppercase drop-shadow-md text-white/90 mb-6 mt-4">Annunciano il loro matrimonio</p>
                <h1 id="hero-names" class="hero-text-anim delay-1 font-cursive text-7xl md:text-[11rem] leading-none drop-shadow-lg mb-4 text-sand-light font-normal py-2">Giulia & Lorenzo</h1>
                <p id="hero-detail" class="hero-text-anim delay-2 font-serif italic text-lg md:text-xl drop-shadow-md text-white/90 mb-2">Cerimonia Civile sulla Spiaggia</p>
                <p id="hero-date" class="hero-text-anim delay-2 font-sans font-medium tracking-[0.2em] text-sm md:text-lg uppercase drop-shadow-md text-white mt-2 mb-8">20 Giugno 2026</p>
                <p id="hero-intro" class="hero-text-anim delay-3 font-serif italic text-xl md:text-3xl text-white mt-4 max-w-3xl leading-relaxed drop-shadow-lg px-2">"Siamo pronti a scriverne un nuovo ricordo, il più importante di tutti. E vogliamo farlo circondati dalle persone che amiamo!"</p>
            </div>
            <div class="gradient-overlay"></div>
        </section>

        <div class="bg-sand-light relative z-20 pb-24">
            <!-- Countdown, RSVP, Galleria, FAQ sections (omessi per brevità, mantengono la struttura precedente) -->
            <div class="max-w-4xl mx-auto px-5 pt-12"><section class="paper-card p-10 reveal"><h2 class="font-serif text-3xl italic text-ocean-dark text-center">Il nostro giorno</h2></section></div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const unboxingLayer = document.getElementById('unboxing-layer');
            const envelopeVideo = document.getElementById('envelope-video');
            const luminousFlash = document.getElementById('luminous-flash');
            const audio = document.getElementById('bg-music');
            const musicToggle = document.getElementById('music-toggle');
            const musicIcon = document.getElementById('music-icon');
            let isPlaying = false;

            // Audio Toggle
            musicToggle.addEventListener('click', () => {
                if (isPlaying) {
                    audio.pause();
                    musicIcon.setAttribute('data-lucide', 'music-off');
                } else {
                    audio.play();
                    musicIcon.setAttribute('data-lucide', 'music');
                }
                lucide.createIcons();
                isPlaying = !isPlaying;
            });

            // Visibility Change: Pausa quando si esce
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    audio.pause();
                } else if (isPlaying) {
                    audio.play();
                }
            });

            // Unboxing Interaction
            let isUnboxingStarted = false;
            unboxingLayer.addEventListener('click', () => {
                if (isUnboxingStarted) return;
                isUnboxingStarted = true;
                envelopeVideo.play();
                audio.play();
                isPlaying = true;
            });

            envelopeVideo.addEventListener('timeupdate', () => {
                if (envelopeVideo.duration - envelopeVideo.currentTime <= 2.5) {
                    luminousFlash.style.opacity = '1';
                }
            });

            envelopeVideo.addEventListener('ended', () => {
                unboxingLayer.style.opacity = '0';
                setTimeout(() => unboxingLayer.style.display = 'none', 1000);
            });
        });
        lucide.createIcons();
    </script>
</body>
</html>
